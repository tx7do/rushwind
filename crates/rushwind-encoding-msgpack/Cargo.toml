[package]
name = "rushwind-encoding-msgpack"
description = "MessagePack engine for the RushWind encoding contract: rmp-serde behind the named-codec registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
erased-serde = { workspace = true }
rushwind-encoding = { workspace = true }
serde = { workspace = true }
rmp-serde = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
# No serde_json dev-dep: the depth tests marshal a format-neutral Frame,
# not serde_json::Value — see the crate docs' wire-portability note.
