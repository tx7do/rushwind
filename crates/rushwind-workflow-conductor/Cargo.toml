[package]
name = "rushwind-workflow-conductor"
description = "Netflix/Orkes Conductor engine for the RushWind workflow contract: the server's REST API over hand-written reqwest — start (POST /workflow, the server can mint ids), describe (GET /workflow/{id}, the status enum's wire names), terminate (DELETE /workflow/{id}), worker run-to-terminal polling, no SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-workflow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
