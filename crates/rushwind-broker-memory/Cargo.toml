[package]
name = "rushwind-broker-memory"
description = "In-process reference broker for the RushWind broker contract: exact-topic pub/sub with true redelivery semantics — Manual settlement parks messages in-flight until ack/nack, the semantic baseline every broker adapter is judged against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["broker"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
