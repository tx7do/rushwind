[package]
name = "rushwind-broker-azuresb"
description = "Azure Service Bus engine for the RushWind broker contract: the entity's HTTP REST face over hand-written reqwest with a hand-rolled SAS signer (pinned against a fixed reference vector) — send POST /messages, receive DELETE /messages/head (receive-and-delete), peek-lock POST /messages/head, complete DELETE, abandon PUT, no SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = "0.22"
percent-encoding = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
