[package]
name = "rushwind-password-argon2"
description = "Argon2id engine for the RushWind password contract: OWASP-default cost parameters, PHC strings, verification driven by the stored hash's embedded parameters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-password = { workspace = true }
# Default features: alloc + password-hash + rand_core (salt generation).
argon2 = "0.5"

# The password-hash face (PHC types, salt generation, constant-time
# Output equality) is used directly, not through the engine crate's re-export.
password-hash = "0.5"

# The crate names `password_hash::rand_core::OsRng` directly; the
# salt generator exists only when rand_core carries the getrandom
# backend. Declared here so the engine is self-sufficient — in the
# framework workspace some other member used to carry the feature
# by accident, and a downstream workspace without that member failed
# to resolve `OsRng`.
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["password"] }
