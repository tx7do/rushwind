[package]
name = "rushwind-password-argon2"
description = "Argon2id engine for the RushWind password contract: OWASP-default cost parameters, PHC strings, verification driven by the stored hash's embedded parameters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-password = { workspace = true }
# Default features: alloc + password-hash + getrandom (salt generation).
argon2 = "0.6"

# The password-hash face (PHC types, salt generation, constant-time
# Output equality) is used directly, not through the engine crate's
# re-export. 0.6 gates everything by default: the PHC types moved to
# the `phc` crate and ride back in behind `phc` + `alloc`; the OS salt
# path behind `getrandom` (rand_core 0.10, which 0.6 tracks, no longer
# ships an OsRng — the old direct rand_core pin is gone with it).
password-hash = { version = "0.6", features = ["phc", "alloc", "getrandom"] }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["password"] }
