[package]
name = "rushwind-workflow-memory"
description = "In-memory reference engine for the RushWind workflow contract: the semantic baseline every external workflow adapter is judged against."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-workflow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
rushwind-testkit = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
