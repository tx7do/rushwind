[package]
name = "rushwind-workflow-temporal"
description = "Temporal engine for the RushWind workflow contract: the server's gRPC-gateway HTTP API over hand-written reqwest — start/describe/terminate, worker run-to-terminal polling, no SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-workflow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
