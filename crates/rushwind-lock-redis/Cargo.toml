[package]
name = "rushwind-lock-redis"
description = "Redis engine for the RushWind lock contract: SET NX PX acquire, token-checked Lua release and extend over the redis crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Live conformance suite (via LOCK_REDIS_URL); run by CI's broker
# integration job against the redis container it already starts.
live = []

[dependencies]
rushwind-lock = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# `script` brings the Lua Script face the ownership-checked release and
# extend run as.
redis = { version = "1", default-features = false, features = [
    "tokio-comp",
    "connection-manager",
    "script",
] }
uuid = { workspace = true }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["lock"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
