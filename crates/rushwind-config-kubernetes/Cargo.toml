[package]
name = "rushwind-config-kubernetes"
description = "Kubernetes ConfigMap source for the RushWind configuration contract: the v1 configmaps REST read (canonical key-sorted JSON), hand-written over reqwest, with a poll-based watch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-config = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
