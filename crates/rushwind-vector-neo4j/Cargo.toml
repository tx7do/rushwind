[package]
name = "rushwind-vector-neo4j"
description = "Neo4j engine for the RushWind vector contract: the HTTP transactional Cypher API over hand-written reqwest — vector-index-backed kNN queries, no SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-vector = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
base64 = "0.22"
rushwind-testkit = { workspace = true, features = ["vector"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
