[package]
name = "rushwind-vector-memory"
description = "In-memory reference engine for the RushWind vector contract: brute-force top-k over upserted vectors, the semantic baseline for external engine adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-vector = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["vector"] }
tokio = { workspace = true, features = ["macros", "rt"] }
