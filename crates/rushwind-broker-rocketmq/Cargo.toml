[package]
name = "rushwind-broker-rocketmq"
description = "RocketMQ engine for the RushWind broker contract: the 4.x remoting protocol (JSON serialization mode) hand-written over tokio — SendMessage/PullMessage/UpdateConsumerOffset with offset-based settlement, no SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-broker = { workspace = true }
rushwind-transport = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
