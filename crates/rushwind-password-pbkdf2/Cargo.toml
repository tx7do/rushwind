[package]
name = "rushwind-password-pbkdf2"
description = "PBKDF2-HMAC-SHA256 engine for the RushWind password contract: OWASP-default rounds, PHC strings, verification driven by the stored hash's embedded parameters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rushwind-password = { workspace = true }
# 0.13 rebuilt on the digest-0.11 wave and split its surface: `phc` is the
# PHC-string face (the old password-hash 0.5 types now live in the `phc`
# crate, surfaced as pbkdf2::password_hash::phc) and carries the sha2 PRF
# set with it; `getrandom` feeds SaltString::generate's OS randomness.
pbkdf2 = { version = "0.13", features = ["phc", "getrandom"] }
# The PRF dispatch imports sha2 directly.
sha2 = { workspace = true }

[dev-dependencies]
rushwind-testkit = { workspace = true, features = ["password"] }
